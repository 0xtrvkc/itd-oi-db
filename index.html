<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vol2vol :: snapshot log</title>
<style>
  :root {
    --bg: #0a0c0a;
    --bg2: #0f120f;
    --line: #1c211c;
    --fg: #c8d0c4;
    --dim: #5a655a;
    --dim2: #3c453c;
    --green: #5fd97a;
    --red: #ff6b5e;
    --amber: #e8c468;
    --cyan: #6fb8d4;
    --mono: "JetBrains Mono", "IBM Plex Mono", "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    font-family: var(--mono);
    color: var(--fg);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: none;
  }

  /* ---------- dropzone ---------- */
  #dropzone {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100vh; color: var(--dim2);
    cursor: pointer; position: relative;
    background:
      linear-gradient(var(--bg2) 1px, transparent 1px) 0 0 / 100% 22px,
      var(--bg);
  }
  #dropzone::before {
    content: "";
    position: absolute; inset: 14px;
    border: 1px dashed var(--dim2);
    pointer-events: none;
  }
  #dropzone.drag::before { border-color: var(--green); }
  #dropzone.drag { color: var(--green); }
  #dropzone .prompt { font-size: 17px; letter-spacing: 1px; }
  #dropzone .prompt .cursor {
    display: inline-block; width: 9px; height: 18px; background: var(--dim2);
    margin-left: 5px; vertical-align: -3px;
    animation: blink 1.1s steps(1) infinite;
  }
  #dropzone.drag .cursor { background: var(--green); }
  @keyframes blink { 50% { opacity: 0; } }
  #dropzone .sub { margin-top: 13px; color: var(--dim2); font-size: 14px; }
  #dropzone input { display: none; }

  /* ---------- app shell ---------- */
  #app { display: none; max-width: 1535px; margin: 0 auto; padding: 23px 21px 78px; }

  .topbar {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 1px solid var(--line); padding-bottom: 13px; margin-bottom: 18px;
    flex-wrap: wrap; gap: 10px;
  }
  .topbar .title { color: var(--fg); font-size: 17px; letter-spacing: 2px; }
  .topbar .title .tick { color: var(--green); }
  .topbar .meta { color: var(--dim); font-size: 14px; text-align: right; }
  .topbar .meta b { color: var(--cyan); }

  /* ---------- stat strip ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(8, 1fr); gap: 1px;
    background: var(--line); border: 1px solid var(--line);
    margin-bottom: 18px; font-size: 14px;
  }
  .stat { background: var(--bg2); padding: 10px 13px; }
  .stat .l { color: var(--dim); text-transform: uppercase; letter-spacing: 1px; font-size: 12px; margin-bottom: 5px; }
  .stat .v { color: var(--fg); font-size: 18px; font-weight: 600; white-space: nowrap; }
  .stat .v.up { color: var(--green); }
  .stat .v.down { color: var(--red); }
  .stat .sub { color: var(--dim2); font-size: 12px; margin-top: 3px; }
  @media (max-width: 980px) { .stats { grid-template-columns: repeat(4, 1fr); } }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, 1fr); } }

  /* ---------- section labels ---------- */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: 2px;
    margin: 23px 0 8px; padding-bottom: 5px; border-bottom: 1px solid var(--line);
  }
  .section-head .hint { color: var(--dim2); text-transform: none; letter-spacing: 0; font-size: 13px; }

  /* ---------- log table ---------- */
  .tablewrap { border: 1px solid var(--line); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 1274px; }
  thead th {
    position: sticky; top: 0; background: var(--bg2);
    color: var(--dim); text-align: right; font-weight: 600;
    padding: 8px 10px; border-bottom: 1px solid var(--line);
    text-transform: uppercase; letter-spacing: 1px; font-size: 12px;
    white-space: nowrap;
  }
  thead th:first-child, thead th:nth-child(2), thead th:nth-child(3) { text-align: left; }
  tbody td {
    padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--line);
    white-space: nowrap; color: var(--fg);
  }
  tbody td:first-child, tbody td:nth-child(2), tbody td:nth-child(3) { text-align: left; }
  tbody tr:hover { background: var(--bg2); }
  tbody tr.flag { background: rgba(232,196,104,0.06); }
  tbody tr.flag:hover { background: rgba(232,196,104,0.1); }
  .idx { color: var(--dim2); }
  .ts { color: var(--cyan); }
  .delta { color: var(--dim); font-size: 13px; }
  .up { color: var(--green); }
  .down { color: var(--red); }
  .zero { color: var(--dim2); }
  .flagcell { color: var(--amber); }
  .num { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-block; font-size: 12px; padding: 1px 5px;
    border: 1px solid var(--dim2); border-radius: 2px; color: var(--dim);
    margin-left: 8px;
  }
  .badge.new { border-color: var(--green); color: var(--green); }

  .footer {
    color: var(--dim2); font-size: 13px; margin-top: 18px;
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
  .footer .blink { color: var(--dim); }

  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--line); }
</style>
</head>
<body>

<div id="dropzone" onclick="document.getElementById('fileInput').click()">
  <div class="prompt">$ load vol2vol.db<span class="cursor"></span></div>
  <div class="sub">drag file onto window, or click to browse</div>
  <input type="file" id="fileInput" accept=".db">
</div>

<div id="app">
  <div class="topbar">
    <div class="title">vol2vol<span class="tick">_</span>log</div>
    <div class="meta" id="topmeta"></div>
  </div>

  <div class="stats" id="statsBar"></div>

  <div class="section-head">
    <span>snapshot log — latest 100</span>
    <span class="hint">Δ vs prior fetch</span>
  </div>
  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>fetched_at (utc)</th>
          <th>Δt</th>
          <th>future</th>
          <th>fut chg</th>
          <th>vol</th>
          <th>vol chg</th>
          <th>Δvol</th>
          <th>put oi</th>
          <th>Δ put oi</th>
          <th>call oi</th>
          <th>Δ call oi</th>
          <th>pc ratio</th>
          <th>Δpc</th>
          <th>dte</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>

  <div class="footer">
    <span id="footerLeft"></span>
    <span class="blink" id="footerRight"></span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
let db;

const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag'); loadFile(e.dataTransfer.files[0]); });
document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));

function q(sql, params = []) {
  const res = db.exec(sql, params);
  return res.length ? res[0].values : [];
}

async function loadFile(file) {
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  const buf = await file.arrayBuffer();
  db = new SQL.Database(new Uint8Array(buf));

  const check = q("SELECT name FROM sqlite_master WHERE type='table' AND name='intraday'");
  if (!check.length) { alert('No "intraday" table found.'); return; }

  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topmeta').textContent = `src ${file.name} :: ${(file.size/1024).toFixed(1)} kb`;

  render();
}

function fmtNum(v, d = 2) {
  if (v === null || v === undefined) return '-';
  return Number(v).toFixed(d);
}
function fmtInt(v) {
  if (v === null || v === undefined) return '-';
  return Number(v).toLocaleString();
}
function fmtTs(t) {
  return t.replace('T', ' ').replace(/\.\d+Z?$/, '').replace('+00:00', '');
}
function deltaCell(curr, prev, d = 2, suffix = '') {
  if (prev === null || prev === undefined) return '<span class="zero">—</span>';
  const diff = curr - prev;
  if (Math.abs(diff) < 1e-9) return '<span class="zero">0' + suffix + '</span>';
  const cls = diff > 0 ? 'up' : 'down';
  const sign = diff > 0 ? '+' : '';
  return `<span class="${cls}">${sign}${diff.toFixed(d)}${suffix}</span>`;
}
function deltaSpark(curr, prev) {
  if (prev === null || prev === undefined) return '';
  const diff = curr - prev;
  if (Math.abs(diff) < 1e-9) return '<span class="zero">·</span>';
  return diff > 0 ? '<span class="up">▲</span>' : '<span class="down">▼</span>';
}

function render() {
  // one row per snapshot (headline fields), aggregated from intraday
  const snaps = q(`
    SELECT fetched_at, symbol, MAX(dte), MAX(future_price), MAX(future_chg),
           MAX(put_oi), MAX(call_oi), MAX(vol), MAX(vol_chg)
    FROM intraday
    GROUP BY fetched_at
    ORDER BY fetched_at DESC
    LIMIT 100
  `);
  if (!snaps.length) return;

  // total snapshot count + version (row) count + per-snapshot strike counts
  const totalSnaps = q("SELECT COUNT(DISTINCT fetched_at) FROM intraday")[0][0];
  const totalRows  = q("SELECT COUNT(*) FROM intraday")[0][0];
  const [minTs, maxTs] = q("SELECT MIN(fetched_at), MAX(fetched_at) FROM intraday")[0];
  const symbol = snaps[0][1];

  // pc ratio per snapshot
  const withPc = snaps.map(r => {
    const [ts, sym, dte, fut, futChg, putOi, callOi, vol, volChg] = r;
    const pc = callOi ? putOi / callOi : null;
    return { ts, dte, fut, futChg, putOi, callOi, vol, volChg, pc };
  });

  // ---- stat strip (senior-quant lens) ----
  const latest = withPc[0];
  const prev = withPc[1] || null;

  // vol regime: realized dispersion of headline vol over visible window
  const volsAll = withPc.map(r => r.vol).filter(v => v != null);
  const volMean = volsAll.reduce((a,b)=>a+b,0) / volsAll.length;
  const volMax = Math.max(...volsAll);
  const volMin = Math.min(...volsAll);

  // pc ratio drift: latest vs avg of window — flow positioning signal
  const pcAll = withPc.map(r => r.pc).filter(v => v != null);
  const pcMean = pcAll.reduce((a,b)=>a+b,0) / pcAll.length;

  // staleness — gap since last fetch vs current time
  const lastFetchMs = new Date(latest.ts).getTime();
  const ageMin = (Date.now() - lastFetchMs) / 60000;

  // median refresh cadence across window
  const gaps = [];
  for (let i = 0; i < withPc.length - 1; i++) {
    gaps.push((new Date(withPc[i].ts) - new Date(withPc[i+1].ts)) / 60000);
  }
  gaps.sort((a,b)=>a-b);
  const medGap = gaps.length ? gaps[Math.floor(gaps.length/2)] : 0;

  // total OI now vs window-ago, for flow buildup
  const oldest = withPc[withPc.length - 1];
  const oiNow = latest.putOi + latest.callOi;
  const oiOld = oldest.putOi + oldest.callOi;
  const oiChgPct = oldest ? ((oiNow - oiOld) / oiOld * 100) : 0;

  const ageFlag = ageMin > medGap * 2;

  document.getElementById('statsBar').innerHTML = `
    <div class="stat"><div class="l">symbol / dte</div><div class="v">${symbol} / ${fmtNum(latest.dte,2)}</div></div>
    <div class="stat"><div class="l">future</div><div class="v">${fmtNum(latest.fut,1)}</div><div class="sub">chg ${fmtNum(latest.futChg,1)}</div></div>
    <div class="stat"><div class="l">vol (latest)</div><div class="v ${latest.volChg>=0?'up':'down'}">${fmtNum(latest.vol,2)}</div><div class="sub">chg ${latest.volChg>=0?'+':''}${fmtNum(latest.volChg,2)}</div></div>
    <div class="stat"><div class="l">vol range (win)</div><div class="v">${fmtNum(volMin,1)}–${fmtNum(volMax,1)}</div><div class="sub">avg ${fmtNum(volMean,2)}</div></div>
    <div class="stat"><div class="l">pc ratio</div><div class="v">${fmtNum(latest.pc,3)}</div><div class="sub">win avg ${fmtNum(pcMean,3)}</div></div>
    <div class="stat"><div class="l">total oi</div><div class="v">${fmtInt(oiNow)}</div><div class="sub ${oiChgPct>=0?'up':'down'}">${oiChgPct>=0?'+':''}${oiChgPct.toFixed(1)}% / ${withPc.length}snaps</div></div>
    <div class="stat"><div class="l">cadence (median)</div><div class="v">${medGap.toFixed(0)}m</div><div class="sub">${gaps.length} gaps sampled</div></div>
    <div class="stat"><div class="l">last fetch age</div><div class="v ${ageFlag?'down':''}">${ageMin.toFixed(0)}m</div><div class="sub">${ageFlag ? 'stale vs cadence' : 'in line'}</div></div>
  `;

  // ---- log table ----
  const body = document.getElementById('logBody');
  body.innerHTML = withPc.map((r, i) => {
    const p = withPc[i+1] || null;
    const gapMin = p ? (new Date(r.ts) - new Date(p.ts)) / 60000 : null;
    const gapStr = gapMin === null ? '<span class="zero">—</span>' : `${gapMin.toFixed(0)}m`;
    const flag = p && gapMin > medGap * 2;
    const pc = r.pc;

    return `<tr class="${flag ? 'flag' : ''}">
      <td class="idx num">${i === 0 ? `<span class="badge new">latest</span>${withPc.length - i}` : withPc.length - i}</td>
      <td class="ts">${fmtTs(r.ts)}</td>
      <td class="delta num ${flag ? 'flagcell' : ''}">${gapStr}</td>
      <td class="num">${fmtNum(r.fut,1)}</td>
      <td class="num ${r.futChg>0?'up':r.futChg<0?'down':'zero'}">${r.futChg>0?'+':''}${fmtNum(r.futChg,1)}</td>
      <td class="num">${fmtNum(r.vol,2)}</td>
      <td class="num ${r.volChg>0?'up':r.volChg<0?'down':'zero'}">${r.volChg>0?'+':''}${fmtNum(r.volChg,2)}</td>
      <td class="delta num">${deltaSpark(r.vol, p?.vol)} ${deltaCell(r.vol, p?.vol, 2)}</td>
      <td class="num">${fmtInt(r.putOi)}</td>
      <td class="delta num">${deltaCell(r.putOi, p?.putOi, 0)}</td>
      <td class="num">${fmtInt(r.callOi)}</td>
      <td class="delta num">${deltaCell(r.callOi, p?.callOi, 0)}</td>
      <td class="num">${fmtNum(pc,3)}</td>
      <td class="delta num">${deltaCell(pc, p?.pc, 3)}</td>
      <td class="num">${fmtNum(r.dte,2)}</td>
    </tr>`;
  }).join('');

  document.getElementById('footerLeft').textContent =
    `${totalSnaps} fetched data versions :: ${totalRows} total rows :: range ${fmtTs(minTs)} → ${fmtTs(maxTs)} utc`;
  document.getElementById('footerRight').textContent =
    `showing ${withPc.length}/${totalSnaps} :: rows flagged where Δt > 2× median cadence`;
}
</script>
</body>
</html>
