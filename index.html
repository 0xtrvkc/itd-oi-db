<style>
/* =========================================================================
   DESIGN TOKENS — "Platinum & Parchment" — a formal, vintage-Apple mobile
   terminal. Pinstripe chrome + brushed-metal bevels (System 7 / early Aqua),
   warm paper palette, ui-serif/ui-monospace resolve to New York / SF Mono
   on Apple hardware for an authentic period feel.
   ========================================================================= */
:root{
  --bg:        #EAE5D8;
  --bg-elev:   #F8F5EC;
  --bg-sunk:   #DFD9C7;
  --bg-well:   #D6CFB9;
  --line:      #C6BEA4;
  --line-str:  #A99E7E;
  --ink:       #2B2620;
  --ink-dim:   #6B6252;
  --ink-faint: #948B76;
  --up:        #4C7A54;
  --up-bg:     #E7EDE2;
  --down:      #A3483A;
  --down-bg:   #F3E5DF;
  --warn:      #A9791E;
  --warn-bg:   #F2E9D2;
  --current:   #3E5C76;
  --current-bg:#E1E8ED;
  --gloss-top: rgba(255,255,255,0.55);
  --gloss-bot: rgba(0,0,0,0.06);
  --shadow:    rgba(43, 38, 32, 0.14);
  --shadow2:   rgba(43, 38, 32, 0.26);

  --font-display: ui-serif, "New York", Georgia, "Times New Roman", serif;
  --font-body:    -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  --font-mono:    ui-monospace, "SF Mono", Menlo, "Courier New", monospace;

  --radius-lg: 16px;
  --radius:    11px;
  --radius-sm: 7px;

  --rb1:#7CAE6B; --rb2:#E4C752; --rb3:#DE9548; --rb4:#C05646; --rb5:#8C6AA8; --rb6:#5B8FC4;
}

[data-theme="dark"]{
  --bg:        #171613;
  --bg-elev:   #211F1B;
  --bg-sunk:   #131210;
  --bg-well:   #0F0E0C;
  --line:      #3A362C;
  --line-str:  #504A3A;
  --ink:       #ECE5D5;
  --ink-dim:   #B0A78F;
  --ink-faint: #7C7460;
  --up:        #7FBE87;
  --up-bg:     #1E2A20;
  --down:      #D9897A;
  --down-bg:   #2E1E1A;
  --warn:      #E0B15E;
  --warn-bg:   #2E2717;
  --current:   #8FB4D6;
  --current-bg:#1B2731;
  --gloss-top: rgba(255,255,255,0.08);
  --gloss-bot: rgba(0,0,0,0.35);
  --shadow:    rgba(0,0,0,0.35);
  --shadow2:   rgba(0,0,0,0.55);
}

*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ background:var(--bg); }
body{
  font-family:var(--font-body);
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  padding-bottom:96px;
  transition:background .3s ease,color .3s ease;
}
.num{ font-variant-numeric:tabular-nums; font-family:var(--font-mono); }
button{ font-family:inherit; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}

/* ===== SIGNATURE — thin candy-stripe hairline, the one vintage-Apple flourish ===== */
.rainbow-bar{
  position:fixed; top:0; left:0; right:0; height:5px; z-index:1200;
  background:linear-gradient(90deg,var(--rb1),var(--rb2),var(--rb3),var(--rb4),var(--rb5),var(--rb6));
}

/* ===== AMBIENT FLUID BACKDROP — slow, smooth, never strobes ===== */
.fluid-field{ position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.fluid-field span{
  position:absolute; border-radius:50%; filter:blur(46px); opacity:.28;
  will-change:transform;
}
.fluid-field span:nth-child(1){ width:260px;height:260px; left:-70px; top:6%; background:var(--rb6); animation:driftA 26s ease-in-out infinite; }
.fluid-field span:nth-child(2){ width:220px;height:220px; right:-60px; top:38%; background:var(--rb2); animation:driftB 32s ease-in-out infinite; }
.fluid-field span:nth-child(3){ width:240px;height:240px; left:8%; bottom:2%; background:var(--rb1); animation:driftC 29s ease-in-out infinite; }
[data-theme="dark"] .fluid-field span{ opacity:.16; }
@keyframes driftA{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(30px,40px) scale(1.12);} }
@keyframes driftB{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-26px,30px) scale(0.9);} }
@keyframes driftC{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(24px,-26px) scale(1.08);} }

/* ===== APP SHELL ===== */
#shell{ position:relative; z-index:1; max-width:520px; margin:0 auto; padding:20px 14px 20px; transition:max-width .25s ease; }
body.pc-view #shell{ max-width:1180px; }
body.pc-view .overview{ grid-template-columns:repeat(6,1fr); }
body.pc-view .tile.lead{ grid-column:span 1; display:flex; flex-direction:column; align-items:flex-start; justify-content:center; }
body.pc-view .tile.lead .tile-sym{ text-align:left; margin-top:2px; }
body.pc-view .segment{ max-width:360px; }

/* ===== HEADER — pinstripe titlebar ===== */
.titlebar{
  position:sticky; top:5px; z-index:100;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:
    repeating-linear-gradient(180deg, var(--gloss-top) 0px, var(--gloss-top) 1px, transparent 1px, transparent 3px),
    linear-gradient(180deg, var(--bg-elev), var(--bg-sunk));
  border:1.5px solid var(--line-str);
  border-radius:var(--radius-lg);
  padding:11px 14px;
  box-shadow:0 3px 10px var(--shadow), inset 0 1px 0 var(--gloss-top);
  margin-bottom:14px;
}
.brand{ display:flex; flex-direction:column; }
.brand-mark{ font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:.2px; color:var(--ink); }
.brand-sub{ font-size:10.5px; text-transform:uppercase; letter-spacing:1.4px; color:var(--ink-faint); margin-top:1px; }
.title-controls{ display:flex; gap:6px; flex-shrink:0; }

.chrome-btn{
  display:flex; align-items:center; justify-content:center;
  width:34px; height:34px;
  background:linear-gradient(180deg, var(--gloss-top), transparent 60%), var(--bg-elev);
  border:1.5px solid var(--line-str);
  border-radius:9px;
  color:var(--ink-dim);
  font-size:15px;
  cursor:pointer;
  box-shadow:0 1px 3px var(--shadow), inset 0 1px 0 var(--gloss-top);
  transition:transform .12s ease, box-shadow .12s ease, color .2s ease;
}
.chrome-btn:active{ transform:translateY(1px) scale(.96); box-shadow:inset 0 1px 3px var(--shadow2); }
.chrome-btn.wide{
  width:auto; min-width:92px; padding:0 14px;
  font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
  color:var(--ink-dim); gap:6px;
}
.chrome-btn.wide:hover{ color:var(--ink); }

/* ===== DROPZONE / IMPORT CARD ===== */
#dropzone{ display:flex; align-items:center; justify-content:center; min-height:70vh; padding:10px; }
.import-card{
  width:100%; max-width:380px;
  background:linear-gradient(180deg, var(--gloss-top), transparent 40%), var(--bg-elev);
  border:1.5px solid var(--line-str);
  border-radius:var(--radius-lg);
  box-shadow:0 8px 28px var(--shadow2), inset 0 1px 0 var(--gloss-top);
  padding:34px 26px 28px;
  text-align:center;
  animation:cardIn .5s cubic-bezier(.22,.9,.3,1) both;
}
.import-glyph{
  width:56px; height:56px; margin:0 auto 18px;
  border:1.5px solid var(--line-str); border-radius:12px;
  display:flex; align-items:center; justify-content:center;
  background:var(--bg-well); box-shadow:inset 0 2px 5px var(--shadow);
}
.import-glyph svg{ width:26px; height:26px; }
.import-title{ font-family:var(--font-display); font-weight:700; font-size:19px; color:var(--ink); margin-bottom:6px; }
.import-sub{ font-size:12.5px; color:var(--ink-dim); margin-bottom:22px; line-height:1.55; }
.import-btn{
  display:inline-flex; align-items:center; gap:8px;
  background:linear-gradient(180deg, var(--gloss-top), transparent 55%), var(--current);
  color:#F5F2E8; border:1.5px solid var(--line-str);
  border-radius:50px; padding:10px 26px;
  font-family:var(--font-body); font-size:13.5px; font-weight:600; letter-spacing:.3px;
  cursor:pointer; box-shadow:0 3px 10px var(--shadow2), inset 0 1px 0 rgba(255,255,255,0.35);
  transition:transform .12s ease;
}
.import-btn:active{ transform:translateY(1px) scale(.98); }
.import-hint{ margin-top:18px; font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:8px; }
.import-hint::before,.import-hint::after{ content:""; flex:1; height:1px; background:var(--line); }
#dropzone.drag .import-card{ border-color:var(--current); box-shadow:0 10px 34px var(--shadow2), 0 0 0 3px var(--current-bg); }
#dropzone input{ display:none; }
.import-error{ color:var(--down); font-size:12.5px; margin-top:4px; }
@keyframes cardIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

/* ===== APP ===== */
#app{ display:none; }

/* ===== OVERVIEW WELL ===== */
.overview{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  margin-bottom:16px;
}
.tile{
  background:var(--bg-well);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:10px 12px 9px;
  box-shadow:inset 0 1px 4px var(--shadow);
}
.tile.lead{
  grid-column:1 / -1;
  display:flex; align-items:baseline; justify-content:space-between;
  background:linear-gradient(180deg, var(--gloss-top), transparent 50%), var(--current-bg);
  border-color:var(--current);
}
.tile-label{ font-size:9.5px; text-transform:uppercase; letter-spacing:1.2px; color:var(--ink-faint); font-weight:600; display:block; margin-bottom:3px; }
.tile-value{ font-family:var(--font-mono); font-size:16px; font-weight:700; color:var(--ink); }
.tile.lead .tile-value{ font-size:28px; color:var(--current); }
.tile.lead .tile-label{ color:var(--current); opacity:.85; }
.tile-sub{ font-size:10.5px; color:var(--ink-dim); margin-top:2px; }
.tile-sym{ font-family:var(--font-display); font-size:13px; color:var(--ink-dim); text-align:right; }

/* ===== SEGMENTED CONTROL ===== */
.segment{
  position:relative;
  display:flex;
  background:var(--bg-well);
  border:1px solid var(--line-str);
  border-radius:50px;
  padding:3px;
  margin-bottom:16px;
  box-shadow:inset 0 1px 4px var(--shadow);
}
.segment-indicator{
  position:absolute; top:3px; bottom:3px; left:3px;
  width:calc(50% - 3px);
  background:linear-gradient(180deg, var(--gloss-top), transparent 60%), var(--bg-elev);
  border:1px solid var(--line-str);
  border-radius:50px;
  box-shadow:0 1px 4px var(--shadow), inset 0 1px 0 var(--gloss-top);
  transition:transform .32s cubic-bezier(.65,0,.35,1);
}
.seg-btn{
  position:relative; z-index:1; flex:1;
  display:flex; align-items:center; justify-content:center; gap:6px;
  background:none; border:none; padding:9px 6px;
  font-size:12.5px; font-weight:600; letter-spacing:.2px;
  color:var(--ink-dim); cursor:pointer;
  transition:color .25s ease;
}
.seg-btn.active{ color:var(--ink); }
.seg-count{ font-size:10px; font-weight:700; opacity:.7; font-family:var(--font-mono); }

/* ===== SECTION HEAD ===== */
.section-head{ display:flex; align-items:baseline; justify-content:space-between; margin:4px 2px 10px; }
.section-title{ font-family:var(--font-display); font-weight:700; font-size:14.5px; color:var(--ink); }
.section-hint{ font-size:10.5px; color:var(--ink-faint); }

.view{ display:none; }
.view.active{ display:block; }

/* ===== SNAPSHOT CARDS ===== */
.snap-list{ display:flex; flex-direction:column; gap:9px; }
.snap-card{
  background:linear-gradient(180deg, var(--gloss-top), transparent 45%), var(--bg-elev);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px 13px 11px;
  box-shadow:0 1.5px 6px var(--shadow);
  transition:transform .12s ease, box-shadow .12s ease, border-color .2s ease;
  animation:cardRise .38s cubic-bezier(.22,.9,.3,1) both;
  animation-delay:var(--d, 0s);
}
.snap-card.clickable{ cursor:pointer; }
.snap-card.clickable:active{ transform:scale(.985); box-shadow:inset 0 1px 4px var(--shadow); }
.snap-card.flag{ border-color:var(--warn); background:linear-gradient(180deg, var(--gloss-top), transparent 45%), var(--warn-bg); }
.snap-card.hot{ border-color:var(--current); background:linear-gradient(180deg, var(--gloss-top), transparent 45%), var(--current-bg); }
@keyframes cardRise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:translateY(0);} }

.card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:9px; }
.dte-block{ display:flex; align-items:baseline; gap:8px; }
.dte-eyebrow{ display:flex; flex-direction:column; }
.dte-label{ font-size:9px; text-transform:uppercase; letter-spacing:1.3px; color:var(--ink-faint); font-weight:700; }
.dte-value{ font-family:var(--font-mono); font-size:22px; font-weight:700; color:var(--ink); line-height:1.05; }
.snap-card.hot .dte-value{ color:var(--current); }
.hot-tag{
  display:inline-flex; align-items:center; gap:4px;
  font-size:9px; font-weight:700; letter-spacing:.8px; text-transform:uppercase;
  color:var(--current); border:1px solid var(--current); border-radius:50px;
  padding:2px 7px 2px 5px; align-self:center;
}
.hot-dot{ width:5px; height:5px; border-radius:50%; background:var(--current); animation:ping 2.6s ease-in-out infinite; }
@keyframes ping{ 0%,100%{ opacity:.5; transform:scale(.85);} 50%{ opacity:1; transform:scale(1.15);} }

.meta-block{ text-align:right; flex-shrink:0; }
.idx-badge{
  display:inline-block; font-size:9.5px; font-weight:700; letter-spacing:.6px;
  color:var(--ink-faint); background:var(--bg-well); border:1px solid var(--line);
  border-radius:50px; padding:2px 8px; margin-bottom:4px;
}
.idx-badge.latest{ color:var(--up); border-color:var(--up); background:var(--up-bg); }
.ts-value{ display:block; font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); white-space:nowrap; }

.card-mid{ margin-bottom:10px; }
.dt-pill{
  display:inline-flex; align-items:center; gap:5px;
  font-family:var(--font-mono); font-size:11px; font-weight:600;
  color:var(--ink-dim); background:var(--bg-well); border:1px solid var(--line);
  border-radius:50px; padding:2.5px 9px;
}
.dt-pill.flag{ color:var(--warn); border-color:var(--warn); background:var(--warn-bg); }
.dt-pill .dt-key{ opacity:.65; }

.metric-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.metric{
  background:var(--bg-well); border:1px solid var(--line); border-radius:var(--radius-sm);
  padding:6px 4px 5px; text-align:center;
}
.m-label{ display:block; font-size:8.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--ink-faint); font-weight:700; margin-bottom:2px; }
.m-value{ font-family:var(--font-mono); font-size:12.5px; font-weight:700; color:var(--ink); }

/* landing confirmation — plays a few times then stops, not a perpetual blink */
.snap-card.landed{ animation:landGlow 1.1s ease-out 2 !important; }
@keyframes landGlow{ 0%{ box-shadow:0 0 0 3px var(--current-bg), 0 1.5px 6px var(--shadow);} 100%{ box-shadow:0 1.5px 6px var(--shadow);} }

/* ===== DESKTOP DATA TABLE (PC VIEW) ===== */
.snap-table-outer{
  border:1.5px solid var(--line-str);
  border-radius:var(--radius);
  box-shadow:0 1.5px 6px var(--shadow), inset 0 1px 0 var(--gloss-top);
  overflow:auto;
  max-height:74vh;
  background:var(--bg-elev);
}
table.snap-table{ width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12.5px; white-space:nowrap; }
table.snap-table thead th{
  position:sticky; top:0; z-index:2;
  background:repeating-linear-gradient(180deg, var(--gloss-top) 0px, var(--gloss-top) 1px, transparent 1px, transparent 3px), var(--bg-sunk);
  border-bottom:1.5px solid var(--line-str);
  padding:9px 12px;
  text-align:right;
  font-family:var(--font-body);
  font-size:10px; text-transform:uppercase; letter-spacing:.7px;
  color:var(--ink-faint); font-weight:700;
}
table.snap-table thead th:first-child,
table.snap-table thead th:nth-child(2){ text-align:left; }
table.snap-table tbody td{
  padding:7px 12px;
  border-bottom:1px solid var(--line);
  text-align:right;
  color:var(--ink);
}
table.snap-table tbody td:first-child,
table.snap-table tbody td:nth-child(2){ text-align:left; }
table.snap-table tbody tr{ transition:background .1s ease; animation:cardRise .3s cubic-bezier(.22,.9,.3,1) both; animation-delay:var(--d,0s); }
table.snap-table tbody tr.clickable{ cursor:pointer; }
table.snap-table tbody tr.clickable:hover{ background:var(--bg-well); }
table.snap-table tbody tr.flag{ background:var(--warn-bg); }
table.snap-table tbody tr.flag:hover{ background:color-mix(in srgb, var(--warn-bg) 70%, var(--bg-well)); }
table.snap-table tbody tr.hot{ background:var(--current-bg); }
table.snap-table tbody tr.hot:hover{ background:color-mix(in srgb, var(--current-bg) 70%, var(--bg-well)); }
table.snap-table tbody tr.hot td:first-child{ color:var(--current); font-weight:700; }
table.snap-table .idx-cell.latest{ color:var(--up); font-weight:700; }
table.snap-table .flag-dot{ color:var(--warn); font-weight:700; }
table.snap-table .hot-inline{
  display:inline-flex; align-items:center; gap:4px; margin-left:6px;
  font-size:8.5px; font-weight:700; letter-spacing:.6px; text-transform:uppercase;
  color:var(--current); border:1px solid var(--current); border-radius:50px; padding:1px 6px 1px 4px;
}
.hot-inline .hot-dot{ width:4px; height:4px; border-radius:50%; background:var(--current); animation:ping 2.6s ease-in-out infinite; }

table.snap-table tbody tr.landed{ animation:rowLandGlow 1.1s ease-out 2 !important; }
@keyframes rowLandGlow{ 0%{ background:var(--current-bg);} 100%{ background:transparent;} }

/* ===== FOOTER ===== */
.footer{
  color:var(--ink-faint); font-size:11px; margin-top:16px; padding:0 4px;
  display:flex; flex-direction:column; gap:3px; line-height:1.5;
}

/* ===== JUMP BUTTON — fixed, static position, no roaming, no strobe ===== */
#jumpBtn{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%);
  z-index:200;
  display:flex; align-items:center; gap:9px;
  background:linear-gradient(180deg, var(--gloss-top), transparent 55%), var(--current);
  color:#F5F2E8; border:1.5px solid var(--line-str);
  border-radius:50px; padding:12px 20px;
  font-family:var(--font-body); font-size:12.5px; font-weight:700; letter-spacing:.2px;
  cursor:pointer; white-space:nowrap; max-width:calc(100vw - 28px); overflow:hidden; text-overflow:ellipsis;
  box-shadow:0 6px 18px var(--shadow2), inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform .12s ease, box-shadow .12s ease;
}
#jumpBtn:active{ transform:translateX(-50%) translateY(1px) scale(.97); }
#jumpBtn .jump-glyph{ font-size:13px; flex-shrink:0; }
#jumpBtn.shake{ animation:settleShake .4s ease-in-out 1; }
@keyframes settleShake{
  0%,100%{ transform:translateX(-50%); }
  25%{ transform:translateX(calc(-50% - 5px)); }
  50%{ transform:translateX(calc(-50% + 5px)); }
  75%{ transform:translateX(calc(-50% - 3px)); }
}

/* ===== STRIKE DETAIL SHEET ===== */
#strikeOverlay{
  display:none; position:fixed; inset:0; z-index:1000;
  background:rgba(20,17,12,0.5); backdrop-filter:blur(3px);
}
[data-theme="dark"] #strikeOverlay{ background:rgba(0,0,0,0.65); }
#strikeOverlay.open{ display:flex; align-items:flex-end; }
#strikeSheet{
  width:100%; max-height:92vh; margin:0 auto;
  background:var(--bg-elev);
  border:1.5px solid var(--line-str); border-bottom:none;
  border-radius:20px 20px 0 0;
  box-shadow:0 -8px 30px var(--shadow2);

<script>
/* ===================== THEME ===================== */
function toggleTheme(){

  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('themeIcon').textContent = isDark ? '☾' : '☀';

}

  if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  document.getElementById('themeIcon').textContent = t === 'dark' ? '☀' : '☾';
})();

/* ===================== VIEW MODE (MOBILE CARDS / DESKTOP TABLE) ===================== */
let viewMode = 'mobile';
function applyViewModeUI(){
  const isPc = viewMode === 'pc';
  document.body.classList.toggle('pc-view', isPc);
  document.getElementById('viewModeIcon').textContent = isPc ? 'Mobile' : 'Desktop';
  document.getElementById('viewModeBtn').title = isPc ? 'Switch to mobile card view' : 'Switch to desktop table view';
}
async function toggleViewMode(){
  viewMode = viewMode === 'pc' ? 'mobile' : 'pc';
  try{ localStorage.setItem('v2v-viewmode', viewMode); }catch(e){}
  applyViewModeUI();
  if(dbMode){ try{ await render(); }catch(e){} }
}
(function initViewMode(){

  try{ saved = localStorage.getItem('v2v-viewmode'); }catch(e){}
  viewMode = (saved === 'pc' || saved === 'mobile') ? saved : 'mobile';
  applyViewModeUI();
})();

/* ===================== TZ TOGGLE (display-only) ===================== */
let tzMode = 'utc';
function applyTzUI(){
  const isBkk = tzMode === 'bkk';
  document.getElementById('tzBtn').title = isBkk ? 'Showing BKK (UTC+7) — tap for UTC' : 'Showing UTC — tap for BKK';
  document.getElementById('tzBtn').textContent = isBkk ? 'BKK' : '🌐';
}
async function toggleTz(){
  tzMode = tzMode === 'utc' ? 'bkk' : 'utc';
  try{ localStorage.setItem('v2v-tz', tzMode); }catch(e){}
  applyTzUI();
  if(dbMode){ try{ await render(); }catch(e){} }
}
(function initTz(){
  try{ tzMode = localStorage.getItem('v2v-tz') || 'utc'; }catch(e){}
  applyTzUI();
})();

/* ===================== SEGMENTED CONTROL ===================== */
function switchTab(name){
  const isIntraday = name === 'intraday';
  document.getElementById('viewIntraday').classList.toggle('active', isIntraday);
  document.getElementById('viewOi').classList.toggle('active', !isIntraday);
  document.getElementById('segBtnIntraday').classList.toggle('active', isIntraday);
  document.getElementById('segBtnOi').classList.toggle('active', !isIntraday);
  const ind = document.getElementById('segIndicator');
  ind.style.transform = isIntraday ? 'translateX(0)' : 'translateX(100%)';
}

/* ===================== JUMP TO CURRENT DTE ===================== */
function jumpToDteHot(){
  const btn = document.getElementById('jumpBtn');
  const activeView = document.querySelector('.view.active');
  const target = (activeView && activeView.querySelector('.snap-card.hot, tr.hot'))
    || document.querySelector('.snap-card.hot, tr.hot');

  if(!target){
    if(btn){
      btn.classList.remove('shake');
      void btn.offsetWidth;
      btn.classList.add('shake');
      setTimeout(()=>btn.classList.remove('shake'), 420);
    }
    return;
  }

  const ownerView = target.closest('.view');
  if(ownerView && !ownerView.classList.contains('active')){
    switchTab(ownerView.id === 'viewOi' ? 'oi' : 'intraday');
  }

  target.scrollIntoView({ behavior:'smooth', block:'center' });

  document.querySelectorAll('.snap-card.landed, tr.landed').forEach(r=>r.classList.remove('landed'));
  void target.offsetWidth;
  target.classList.add('landed');
  setTimeout(()=>target.classList.remove('landed'), 2300);
}

/* ---- current-contract anchor tracking (unchanged logic, restyled output) ---- */
let currentDteAnchorVal = null;
let currentDteAnchorTs = null;

function walkCycleAnchor(rows){
  if(!rows.length) return { anchorVal:null, anchorTs:null };
  const EPS = 0.01;
  let anchorVal = rows[0][0];
  let anchorTs = rows[0][1];
  for(let i=1;i<rows.length;i++){
    const [dte, ts] = rows[i];
    if(dte >= anchorVal - EPS){
      if(dte > anchorVal) anchorVal = dte;
      anchorTs = ts;
    } else break;
  }
  return { anchorVal, anchorTs };
}

async function computeCycleAnchor(){
  let best = { anchorVal:null, anchorTs:null };
  for(const t of ['intraday','oi']){
    const check = await q(`SELECT name FROM sqlite_master WHERE type='table' AND name='${t}'`);
    if(!check.length) continue;
    const rows = await q(`
      SELECT dte, fetched_at FROM (
        SELECT fetched_at, MAX(dte) AS dte
        FROM ${t}
        WHERE dte IS NOT NULL AND dte >= 0
        GROUP BY fetched_at
      )
      ORDER BY fetched_at DESC LIMIT 500
    `);
    const { anchorVal, anchorTs } = walkCycleAnchor(rows);
    if(anchorTs !== null && (best.anchorTs === null || anchorTs > best.anchorTs)){
      best = { anchorVal, anchorTs };
    }
  }
  return best;
}

function anchorDateStr(ts){
  if(ts == null) return null;
  try{
    let base = new Date(ts.includes('Z') || ts.includes('+') ? ts : ts + 'Z');
    if(isNaN(base.getTime())) return null;
    if(typeof tzMode !== 'undefined' && tzMode === 'bkk') base = new Date(base.getTime() + 7*3600*1000);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${months[base.getUTCMonth()]} ${base.getUTCDate()}`;
  }catch(e){ return null; }
}

async function updateJumpButton(){
  const { anchorVal, anchorTs } = await computeCycleAnchor();
  currentDteAnchorVal = anchorVal;
  currentDteAnchorTs = anchorTs;
  const labelEl = document.getElementById('jumpLabel');
  const btn = document.getElementById('jumpBtn');
  if(!labelEl) return;
  if(anchorVal === null){
    labelEl.textContent = 'Jump to Current DTE';
    if(btn) btn.title = 'No DTE data loaded yet';
    return;
  }
  const dateStr = anchorDateStr(anchorTs);
  labelEl.textContent = `Jump to ${anchorVal.toFixed(2)} DTE${dateStr ? ' · ' + dateStr : ''}`;
  if(btn) btn.title = `Scroll to the current contract's anchor row (DTE ${anchorVal.toFixed(2)}${dateStr ? ', ' + dateStr : ''})`;
}

/* ===================== DB =====================
   Two possible modes:
   - 'httpvfs': remote DB queried lazily over HTTP Range requests (sql.js-httpvfs).
                Only the SQLite pages a query actually touches are fetched, so
                this stays fast no matter how large the .db file grows.
   - 'local':   a full DB loaded from a file the user dropped in manually,
                using regular in-browser sql.js (small local files only).
*/
let db;        // sql.js Database instance, used in 'local' mode
let dbWorker;  // sql.js-httpvfs worker handle, used in 'httpvfs' mode
let dbMode = null;

const DB_URL = 'https://raw.githubusercontent.com/0xtrvkc/itd-oi-db/main/data/vol2vol.db';
const DB_PAGE_SIZE = 4096; // must match the page_size the .db was VACUUM'd with

async function q(sql, params = []){
  if(dbMode === 'httpvfs'){
    const res = await dbWorker.db.exec(sql, params);
    return res.length ? res[0].values : [];
  }
  const res = db.exec(sql, params);
  return res.length ? res[0].values : [];
}

async function autoLoad(){
  const dz = document.getElementById('dropzone');
  const sub = document.getElementById('importSub');
  const title = document.querySelector('.import-title');

  title.textContent = 'Connecting';
  sub.innerHTML = `Connecting to <strong>vol2vol.db</strong>&hellip;`;

  try{
    dbWorker = await createDbWorker(
      [{
        from: 'inline',
        config: {
          serverMode: 'full',
          url: DB_URL,
          requestChunkSize: DB_PAGE_SIZE,
          // bust CDN/browser caching of stale pages once per session, without
          // ever re-downloading the whole file the way the old code did
          cacheBust: String(Date.now())
        }
      }],
      'sql-httpvfs/sqlite.worker.js',
      'sql-httpvfs/sql-wasm.wasm'
    );
    dbMode = 'httpvfs';

    const check = await q("SELECT name FROM sqlite_master WHERE type='table' AND name='intraday'");
    if(!check.length) throw new Error('No "intraday" table found in database');

    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('topmeta').textContent = `vol2vol.db · streamed · auto-loaded`;

    await render();
  }catch(err){
    title.textContent = 'Import Failed';
    sub.innerHTML = `<span class="import-error">${err.message}</span>`;
    const existingRetry = document.getElementById('retryBtn');
    if(!existingRetry){
      const b = document.createElement('button');
      b.id = 'retryBtn'; b.className = 'import-btn'; b.style.marginTop = '18px';
      b.textContent = 'Retry';
      b.onclick = (e)=>{ e.stopPropagation(); autoLoad(); };
      document.querySelector('.import-card').appendChild(b);
    }
  }
}

const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e=>{ e.preventDefault(); dz.classList.add('drag'); });
dz.addEventListener('dragleave', ()=>dz.classList.remove('drag'));
dz.addEventListener('drop', e=>{
  e.preventDefault(); dz.classList.remove('drag');
  loadFileManual(e.dataTransfer.files[0]);
});
document.getElementById('fileInput').addEventListener('change', e=>loadFileManual(e.target.files[0]));

async function loadFileManual(file){
  if(!file) return;
  const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });
  const buf = await file.arrayBuffer();
  db = new SQL.Database(new Uint8Array(buf));
  dbMode = 'local';

  const check = await q("SELECT name FROM sqlite_master WHERE type='table' AND name='intraday'");
  if(!check.length){ alert('No "intraday" table found.'); return; }

  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('topmeta').textContent = `${file.name} · ${(file.size/1024).toFixed(1)} kb`;

  await render();
}

autoLoad();

/* ===================== FORMAT HELPERS ===================== */
function fmtNum(v, d = 2){ if(v === null || v === undefined) return '—'; return Number(v).toFixed(d); }
function fmtInt(v){ if(v === null || v === undefined) return '—'; return Number(v).toLocaleString(); }
function fmtTs(t){
  const legacyUtc = () => t.replace('T',' ').replace(/\.\d+Z?$/,'').replace('+00:00','');
  if(typeof tzMode === 'undefined' || tzMode === 'utc') return legacyUtc();
  try{
    const d = new Date(t.includes('Z') || t.includes('+') ? t : t + 'Z');
    if(isNaN(d.getTime())) return legacyUtc();
    const bkk = new Date(d.getTime() + 7*3600*1000);
    const pad = n => String(n).padStart(2,'0');
    return `${bkk.getUTCFullYear()}-${pad(bkk.getUTCMonth()+1)}-${pad(bkk.getUTCDate())} ${pad(bkk.getUTCHours())}:${pad(bkk.getUTCMinutes())}:${pad(bkk.getUTCSeconds())}`;
  }catch(e){ return legacyUtc(); }
}
function tzSuffix(){ return (typeof tzMode !== 'undefined' && tzMode === 'bkk') ? 'bkk (utc+7)' : 'utc'; }

async function loadSnapshots(table, limit = 300){
  const snaps = await q(`
    SELECT fetched_at, symbol, MAX(dte), MAX(future_price), MAX(future_chg),
           MAX(put_oi), MAX(call_oi), MAX(vol), MAX(vol_chg)
    FROM ${table}
    GROUP BY fetched_at
    ORDER BY fetched_at DESC
    LIMIT ${limit}
  `);
  return snaps.map(r=>{
    const [ts, sym, dte, fut, futChg, putOi, callOi, vol, volChg] = r;
    return { ts, sym, dte, fut, putOi, callOi, vol };
  });
}

/* ===================== SNAPSHOT CARDS — DTE leads, only Δt kept ===================== */
function buildLogCardsHtml(withPc, medGap, tableName){
  return withPc.map((r, i)=>{
    const p = withPc[i+1] || null;
    const gapMin = p ? (new Date(r.ts) - new Date(p.ts)) / 60000 : null;
    const gapStr = gapMin === null ? '—' : `${gapMin.toFixed(0)}m`;
    const flag = p && gapMin > medGap * 2;

    const isDteHot = r.ts != null && currentDteAnchorTs != null && r.ts === currentDteAnchorTs;
    const dteMarkup = isDteHot
      ? `${fmtNum(r.dte,2)}<span class="hot-tag"><span class="hot-dot"></span>current</span>`
      : fmtNum(r.dte,2);

    const tsEscaped = String(r.ts).replace(/'/g, "\\'");
    const cardClasses = ['snap-card', flag ? 'flag' : '', isDteHot ? 'hot' : '', tableName ? 'clickable' : '']
      .filter(Boolean).join(' ');
    const cardAttrs = tableName
      ? `class="${cardClasses}" onclick="openStrikeModal('${tableName}','${tsEscaped}')"`
      : `class="${cardClasses}"`;
    const delay = Math.min(i, 14) * 0.025;

    return `<div ${cardAttrs} style="--d:${delay}s">
      <div class="card-top">
        <div class="dte-block">
          <div class="dte-eyebrow"><span class="dte-label">DTE</span><span class="dte-value num">${dteMarkup}</span></div>
        </div>
        <div class="meta-block">
          <span class="idx-badge ${i===0?'latest':''}">${i===0 ? 'LATEST' : '#'+(withPc.length - i)}</span>
          <span class="ts-value">${fmtTs(r.ts)}</span>
        </div>
      </div>
      <div class="card-mid">
        <span class="dt-pill ${flag ? 'flag':''}"><span class="dt-key">Δt</span> ${gapStr}</span>
      </div>
      <div class="metric-grid">
        <div class="metric"><span class="m-label">Future</span><span class="m-value">${fmtNum(r.fut,1)}</span></div>
        <div class="metric"><span class="m-label">Vol</span><span class="m-value">${fmtNum(r.vol,2)}</span></div>
        <div class="metric"><span class="m-label">Put OI</span><span class="m-value">${fmtInt(r.putOi)}</span></div>
        <div class="metric"><span class="m-label">Call OI</span><span class="m-value">${fmtInt(r.callOi)}</span></div>
      </div>
    </div>`;
  }).join('');
}

/* ===================== SNAPSHOT TABLE — dense desktop view, every column visible ===================== */
function buildLogTableHtml(withPc, medGap, tableName){
  const rows = withPc.map((r, i)=>{
    const p = withPc[i+1] || null;
    const gapMin = p ? (new Date(r.ts) - new Date(p.ts)) / 60000 : null;
    const gapStr = gapMin === null ? '—' : `${gapMin.toFixed(0)}m`;
    const flag = p && gapMin > medGap * 2;

    const isDteHot = r.ts != null && currentDteAnchorTs != null && r.ts === currentDteAnchorTs;
    const hotMarkup = isDteHot ? `<span class="hot-inline"><span class="hot-dot"></span>current</span>` : '';

    const totalOi = (r.putOi || 0) + (r.callOi || 0);
    const tsEscaped = String(r.ts).replace(/'/g, "\\'");
    const rowClasses = ['clickable', flag ? 'flag' : '', isDteHot ? 'hot' : ''].filter(Boolean).join(' ');
    const rowAttrs = tableName
      ? `class="${rowClasses}" onclick="openStrikeModal('${tableName}','${tsEscaped}')"`
      : `class="${rowClasses.replace('clickable','').trim()}"`;
    const delay = Math.min(i, 20) * 0.015;

    return `<tr ${rowAttrs} style="--d:${delay}s">
      <td class="idx-cell ${i===0?'latest':''}">${i===0 ? 'LATEST' : '#'+(withPc.length - i)}</td>
      <td>${fmtTs(r.ts)}</td>
      <td class="num">${fmtNum(r.dte,2)}${hotMarkup}</td>
      <td class="num">${flag ? '<span class="flag-dot">⚠ </span>' : ''}${gapStr}</td>
      <td class="num">${fmtNum(r.fut,1)}</td>
      <td class="num">${fmtNum(r.vol,2)}</td>
      <td class="num">${fmtInt(r.putOi)}</td>
      <td class="num">${fmtInt(r.callOi)}</td>
      <td class="num">${fmtInt(totalOi)}</td>
      <td>${r.sym || '—'}</td>
    </tr>`;
  }).join('');

  return `<div class="snap-table-outer"><table class="snap-table">
    <thead><tr>
      <th>#</th><th>Timestamp</th><th>DTE</th><th>Δt</th><th>Future</th><th>Vol</th><th>Put OI</th><th>Call OI</th><th>Total OI</th><th>Symbol</th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ===================== RENDER ===================== */
async function render(){
  const check = await q("SELECT name FROM sqlite_master WHERE type='table' AND name='intraday'");
  if(!check.length) return;

  await updateJumpButton();

  const withPc = await loadSnapshots('intraday', 300);
  if(!withPc.length) return;

  const totalSnaps = (await q("SELECT COUNT(DISTINCT fetched_at) FROM intraday"))[0][0];
  const totalRows  = (await q("SELECT COUNT(*) FROM intraday"))[0][0];
  const [minTs, maxTs] = (await q("SELECT MIN(fetched_at), MAX(fetched_at) FROM intraday"))[0];
  const symbol = withPc[0].sym;
  const latest = withPc[0];

  const gaps = [];
  for(let i=0;i<withPc.length-1;i++){
    gaps.push((new Date(withPc[i].ts) - new Date(withPc[i+1].ts)) / 60000);
  }
  gaps.sort((a,b)=>a-b);
  const medGap = gaps.length ? gaps[Math.floor(gaps.length/2)] : 0;

  const oldest = withPc[withPc.length - 1];
  const oiNow = latest.putOi + latest.callOi;

  const lastFetchMs = new Date(latest.ts).getTime();
  const ageMin = (Date.now() - lastFetchMs) / 60000;
  const ageFlag = ageMin > medGap * 2;

  document.getElementById('overview').innerHTML = `
    <div class="tile lead">
      <div><span class="tile-label">DTE</span><span class="tile-value">${fmtNum(latest.dte,2)}</span></div>
      <span class="tile-sym">${symbol || ''}</span>
    </div>
    <div class="tile"><span class="tile-label">Future</span><span class="tile-value">${fmtNum(latest.fut,1)}</span></div>
    <div class="tile"><span class="tile-label">Vol</span><span class="tile-value">${fmtNum(latest.vol,2)}</span></div>
    <div class="tile"><span class="tile-label">Total OI</span><span class="tile-value">${fmtInt(oiNow)}</span><div class="tile-sub">put ${fmtInt(latest.putOi)} · call ${fmtInt(latest.callOi)}</div></div>
    <div class="tile"><span class="tile-label">Cadence</span><span class="tile-value">${medGap.toFixed(0)}m</span><div class="tile-sub">${gaps.length} intervals</div></div>
    <div class="tile"><span class="tile-label">Updated</span><span class="tile-value" style="${ageFlag?'color:var(--warn)':''}">${ageMin.toFixed(0)}m ago</span><div class="tile-sub">${ageFlag ? 'delayed' : 'on schedule'}</div></div>
  `;

  const logBodyEl = document.getElementById('logBody');
  logBodyEl.className = viewMode === 'pc' ? '' : 'snap-list';
  logBodyEl.innerHTML = viewMode === 'pc'
    ? buildLogTableHtml(withPc, medGap, 'intraday')
    : buildLogCardsHtml(withPc, medGap, 'intraday');

  document.getElementById('footerLeft').textContent =
    `${totalSnaps} fetched versions · ${totalRows} total rows · range ${fmtTs(minTs)} → ${fmtTs(maxTs)} ${tzSuffix()}`;
  document.getElementById('footerRight').textContent =
    `showing ${withPc.length} of ${totalSnaps} · flagged where Δt exceeds 2× median cadence`;

  document.getElementById('countIntraday').textContent = `${totalSnaps}`;

  await renderOi();
}

async function renderOi(){
  const check = await q("SELECT name FROM sqlite_master WHERE type='table' AND name='oi'");
  if(!check.length){
    document.getElementById('countOi').textContent = '0';
    document.getElementById('oiBody').innerHTML =
      '<div class="sheet-empty" style="padding:30px 10px;">No "oi" table found — re-run the fetch script with the updated parser.</div>';
    document.getElementById('footerLeftOi').textContent = 'no data yet';
    document.getElementById('footerRightOi').textContent = '';
    return;
  }

  const withPc = await loadSnapshots('oi', 300);
  document.getElementById('countOi').textContent = `${(await q("SELECT COUNT(DISTINCT fetched_at) FROM oi"))[0][0]}`;

  if(!withPc.length){
    document.getElementById('oiBody').innerHTML =
      '<div class="sheet-empty" style="padding:30px 10px;">No OI rows yet.</div>';
    document.getElementById('footerLeftOi').textContent = 'no data yet';
    document.getElementById('footerRightOi').textContent = '';
    return;
  }

  const totalSnaps = (await q("SELECT COUNT(DISTINCT fetched_at) FROM oi"))[0][0];
  const totalRows  = (await q("SELECT COUNT(*) FROM oi"))[0][0];
  const [minTs, maxTs] = (await q("SELECT MIN(fetched_at), MAX(fetched_at) FROM oi"))[0];

  const gaps = [];
  for(let i=0;i<withPc.length-1;i++){
    gaps.push((new Date(withPc[i].ts) - new Date(withPc[i+1].ts)) / 60000);
  }
  gaps.sort((a,b)=>a-b);
  const medGap = gaps.length ? gaps[Math.floor(gaps.length/2)] : 0;

  const oiBodyEl = document.getElementById('oiBody');
  oiBodyEl.className = viewMode === 'pc' ? '' : 'snap-list';
  oiBodyEl.innerHTML = viewMode === 'pc'
    ? buildLogTableHtml(withPc, medGap, 'oi')
    : buildLogCardsHtml(withPc, medGap, 'oi');

  document.getElementById('footerLeftOi').textContent =
    `${totalSnaps} fetched versions · ${totalRows} total rows · range ${fmtTs(minTs)} → ${fmtTs(maxTs)} ${tzSuffix()}`;
  document.getElementById('footerRightOi').textContent =
    `showing ${withPc.length} of ${totalSnaps} · flagged where Δt exceeds 2× median cadence`;
}

/* ===================== STRIKE DETAIL SHEET ===================== */
function fmtPct(v, d = 2){
  if(v === null || v === undefined || isNaN(v)) return '—';
  return (Number(v) * 100).toFixed(d) + '%';
}

async function openStrikeModal(tableName, ts){
  if(!dbMode) return;

  const strikeRows = await q(
    `SELECT strike, call, put, vol_settle FROM ${tableName} WHERE fetched_at = ? ORDER BY strike ASC`,
    [ts]
  );

  const modalBody = document.getElementById('strikeTableBody');
  const overlay = document.getElementById('strikeOverlay');

  if(!strikeRows.length){
    document.getElementById('strikeModalTitle').textContent = 'Strike Breakdown';
    document.getElementById('strikeModalSub').textContent = fmtTs(ts) + ' ' + tzSuffix();
    document.getElementById('strikeModalStats').innerHTML = '';
    modalBody.innerHTML = `<div class="sheet-empty">No per-strike rows found for this snapshot.</div>`;
    overlay.classList.add('open');
    document.addEventListener('keydown', escCloseStrikeModal);
    return;
  }

  const meta = (await q(
    `SELECT symbol, dte, future_price, future_chg, put_oi, call_oi, vol, vol_chg FROM ${tableName} WHERE fetched_at = ? LIMIT 1`,
    [ts]
  ))[0] || [];
  const [symbol, dte, futPrice, futChg, putOiTotal, callOiTotal, vol, volChg] = meta;

  let atmIdx = 0, atmDiff = Infinity;
  let maxCallIdx = 0, maxCallVal = -Infinity;
  let maxPutIdx = 0, maxPutVal = -Infinity;
  let minVolIdx = -1, minVolVal = Infinity;
  let maxOiForBars = 0;

  strikeRows.forEach((r, idx)=>{
    const [strike, callOi, putOi, volSettle] = r;
    const diff = Math.abs(strike - futPrice);
    if(diff < atmDiff){ atmDiff = diff; atmIdx = idx; }
    if(callOi > maxCallVal){ maxCallVal = callOi; maxCallIdx = idx; }
    if(putOi > maxPutVal){ maxPutVal = putOi; maxPutIdx = idx; }
    if(volSettle != null && !isNaN(volSettle) && volSettle > 0 && volSettle < minVolVal){ minVolVal = volSettle; minVolIdx = idx; }
    maxOiForBars = Math.max(maxOiForBars, callOi || 0, putOi || 0);
  });

  document.getElementById('strikeModalTitle').textContent = `${symbol || ''} · ${strikeRows.length} strikes`;
  document.getElementById('strikeModalSub').textContent = `${fmtTs(ts)} ${tzSuffix()} · ${tableName}`;

  document.getElementById('strikeModalStats').innerHTML = `
    <div><div class="s-l">Future</div><div class="s-v">${fmtNum(futPrice,1)}</div></div>
    <div><div class="s-l">DTE</div><div class="s-v">${fmtNum(dte,2)}</div></div>
    <div><div class="s-l">Vol (settle avg)</div><div class="s-v">${fmtNum(vol,2)}</div></div>
    <div><div class="s-l">Put / Call OI</div><div class="s-v">${fmtInt(putOiTotal)} / ${fmtInt(callOiTotal)}</div></div>
  `;

  function sideCell(side, oi, pct){
    const val = oi || 0;
    if(!val) return `<span class="sr-num-outside zero-num">0</span>`;
    const label = fmtInt(val);
    if(pct < 16){
      const stub = `<span class="sr-bar ${side}" style="width:0%"></span>`;
      const num = `<span class="sr-num-outside">${label}</span>`;
      requestAnimationFrame(()=>{});
      return side === 'put' ? num + stub.replace('width:0%','width:6px') : stub.replace('width:0%','width:6px') + num;
    }
    return `<span class="sr-bar ${side}" data-w="${pct}" style="width:0%"><span class="sr-bar-label">${label}</span></span>`;
  }

  modalBody.innerHTML = strikeRows.map((r, idx)=>{
    const [strike, callOi, putOi, volSettle] = r;
    const callPct = maxOiForBars ? Math.round((callOi || 0) / maxOiForBars * 100) : 0;
    const putPct  = maxOiForBars ? Math.round((putOi || 0) / maxOiForBars * 100) : 0;
    const isMinVol = idx === minVolIdx && minVolVal < Infinity;
    const rowClasses = [
      idx === atmIdx ? 'atm' : '',
      isMinVol ? 'min-vol' : ''
    ].filter(Boolean).join(' ');
    const ivDigits = isMinVol ? 4 : 1;
    const ivContent = isMinVol
      ? `${fmtPct(volSettle, ivDigits)}<span class="min-vol-tag">low iv</span>`
      : fmtPct(volSettle, ivDigits);

    return `<div class="strike-row ${rowClasses}" ${idx === atmIdx ? 'id="srAtmRow"' : ''}>
      <div class="sr-put">${sideCell('put', putOi, putPct)}</div>
      <div class="sr-strike">
        ${idx === atmIdx ? '<span class="sr-atm-dot">◆</span>' : ''}
        <span>${fmtNum(strike, 0)}</span>
        <span class="sr-iv">${ivContent}</span>
      </div>
      <div class="sr-call">${sideCell('call', callOi, callPct)}</div>
    </div>`;
  }).join('');

  overlay.classList.add('open');
  document.addEventListener('keydown', escCloseStrikeModal);

  // fluid grow-in for the diverging bars, then settle
  requestAnimationFrame(()=>{
    document.querySelectorAll('.sr-bar[data-w]').forEach(el=>{
      el.style.width = el.getAttribute('data-w') + '%';
    });
    const atmEl = document.getElementById('srAtmRow');
    if(atmEl) atmEl.scrollIntoView({ block:'center' });
  });
}

function closeStrikeModal(){
  document.getElementById('strikeOverlay').classList.remove('open');
  document.removeEventListener('keydown', escCloseStrikeModal);
}
function escCloseStrikeModal(e){ if(e.key === 'Escape') closeStrikeModal(); }
</script>
