name: Fetch Vol2Vol Data

on:
  workflow_dispatch:          # triggered externally every 5 min via cron-job.org
  schedule:
    - cron: '*/15 * * * *'    # backup, in case external trigger fails

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_and_store.py

      - name: Commit updated DB
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vol2vol.db
          git diff --staged --quiet || git commit -m "data: update vol2vol db [skip ci]"
          git push
